<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consumo de API XML</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="atividade1-xml.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Atividade 1 &mdash; Consumo de API XML</span>
    </div>
  </nav>

  <main class="container">

    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Requisição</h5>

        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label for="metodo" class="form-label">Método</label>
            <select id="metodo" class="form-select">
              <option value="GET" selected>GET</option>
              <option value="POST">POST</option>
              <option value="PUT">PUT</option>
              <option value="DELETE">DELETE</option>
            </select>
          </div>

          <div class="col-md-7">
            <label for="urlApi" class="form-label">URL da API</label>
            <input type="text" id="urlApi" class="form-control" placeholder="https://exemplo.com/api/dados.xml">
          </div>

          <div class="col-md-2 d-grid">
            <button id="btnEnviar" type="button" class="btn btn-primary">Enviar</button>
          </div>
        </div>

        <div class="mt-3">
          <label for="corpoRequisicao" class="form-label">Corpo XML (para POST/PUT)</label>
          <textarea id="corpoRequisicao" class="form-control font-monospace" rows="5" placeholder="&lt;pedido&gt;&#10;  &lt;item&gt;Exemplo&lt;/item&gt;&#10;&lt;/pedido&gt;"></textarea>
        </div>
      </div>
    </div>

    <div id="statusArea" class="mb-4"></div>

    <div class="row">
      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-header">XML bruto (resposta)</div>
          <div class="card-body">
            <pre id="xmlBruto" class="bg-light p-3 rounded border mb-0"><code>Aguardando requisição...</code></pre>
          </div>
        </div>
      </div>

      <div class="col-lg-6 mb-4">
        <div class="card h-100">
          <div class="card-header">Dados extraídos</div>
          <div class="card-body">
            <table class="table table-striped table-sm mb-0">
              <thead>
                <tr id="tabelaCabecalho"></tr>
              </thead>
              <tbody id="tabelaCorpo">
                <tr>
                  <td class="text-muted">Sem dados ainda</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer class="container text-center text-muted small mb-4">
    Atividade 1 &mdash; consumo de API retornando XML
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="atividade1-xml.js"></script>
</body>
</html>
