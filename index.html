<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo do Blog</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Painel Administrativo &mdash; Blog</span>
    </div>
  </nav>

  <main class="container">

    <!-- 2.1 Inclusão de Posts (POST) -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Novo post</h5>

        <form id="formNovoPost" novalidate>
          <div class="row g-2">
            <div class="col-md-4">
              <label for="tituloPost" class="form-label">Título</label>
              <input type="text" id="tituloPost" class="form-control" placeholder="Título do post" required>
            </div>

            <div class="col-md-6">
              <label for="conteudoPost" class="form-label">Conteúdo</label>
              <textarea id="conteudoPost" class="form-control" rows="1" placeholder="Conteúdo do post" required></textarea>
            </div>

            <div class="col-md-2 d-grid align-self-end">
              <button type="submit" id="btnPublicar" class="btn btn-success">Publicar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="mensagemStatus" class="mb-3"></div>

    <!-- 2.1 Listagem de Posts (GET) -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Posts</h5>
      <button type="button" id="btnAtualizar" class="btn btn-outline-secondary btn-sm">Atualizar lista</button>
    </div>

    <p id="mensagemLista" class="text-muted">Carregando posts...</p>

    <div id="listaPosts" class="row"></div>

    <!-- Modelo de card usado pelo JS para cada post da lista -->
    <template id="templatePost">
      <div class="col-md-6 col-lg-4 mb-3 post-item">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title post-titulo"></h6>
            <p class="card-text post-conteudo flex-grow-1"></p>
            <!-- 2.1 Exclusão de Posts (DELETE) -->
            <button type="button" class="btn btn-outline-danger btn-sm btn-excluir">Excluir</button>
          </div>
        </div>
      </div>
    </template>

  </main>

  <footer class="container text-center text-muted small mb-4">
    Atividade &mdash; painel administrativo consumindo JSONPlaceholder (/posts)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
